name: 나라장터 공고 수집

on:
  schedule:
    # 한국시간 07:50 / 11:50 / 16:50 (GitHub은 UTC 기준이라 -9시간)
    - cron: "50 22 * * *"
    - cron: "50 2 * * *"
    - cron: "50 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 공고 수집
        env:
          SERVICE_KEY: ${{ secrets.SERVICE_KEY }}
          TZ: Asia/Seoul
        run: python -u collect.py

      - name: 결과 저장 (변경 있을 때만)
        run: |
          git config user.name "bid-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet || git commit -m "공고 데이터 갱신 $(TZ=Asia/Seoul date +'%m-%d %H:%M')"
          git push
