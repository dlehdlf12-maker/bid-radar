<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>입찰 레이더</title>
<style>
  @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css");
  :root{
    --bg:#f6f5f1; --panel:#fff; --line:#e9e7e1; --line2:#dfe3ea; --text:#141a24; --sub:#6b7280; --muted:#a0a6b1;
    --brand:#1f5eff; --brand-2:#3b7bff; --brand-soft:#ecf2ff; --ink:#0d111a;
    --ok:#0b8a72; --ok-bg:#e2f5f0; --warn:#b26a00; --warn-bg:#fff3df; --no:#d92d20; --no-bg:#fdeceb;
    --r-lg:20px; --r-md:14px; --r-sm:10px;
    --shadow:0 1px 2px rgba(16,24,40,.04),0 4px 14px rgba(16,24,40,.04);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;letter-spacing:-.2px;-webkit-font-smoothing:antialiased}
  .num,.v,.recv,td{font-variant-numeric:tabular-nums}

  /* 상단바 */
  header{background:#fff;border-bottom:1px solid var(--line);padding:14px 28px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
  header h1{font-size:19px;margin:0;font-weight:800;letter-spacing:-.6px}
  header h1 em{font-style:normal;color:var(--brand)}
  header .tag{font-size:11px;font-weight:700;color:#fff;background:linear-gradient(135deg,#1fb6ff,#1f5eff);padding:4px 10px;border-radius:8px}
  header .right{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:12px}
  header .pill{border:1px solid var(--line2);border-radius:10px;padding:7px 12px;color:var(--sub);background:#fff}
  header .pill b{color:var(--text)}
  header .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#12b76a;margin-right:6px}

  .wrap{display:grid;grid-template-columns:300px 1fr;gap:18px;padding:18px 28px;max-width:1560px;margin:0 auto}

  /* 필터 패널 */
  aside{background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);align-self:start;position:sticky;top:76px;max-height:calc(100vh - 92px);display:flex;flex-direction:column;overflow:hidden}
  .fhead{display:flex;justify-content:space-between;align-items:flex-start;padding:20px 20px 14px;border-bottom:1px solid var(--line)}
  .fhead h2{margin:0;font-size:19px;font-weight:800;letter-spacing:-.5px}
  .fhead .cnt{font-size:12px;color:var(--muted);margin-top:4px}
  .reset{border:0;background:var(--brand-soft);color:var(--brand);font:inherit;font-weight:700;font-size:13px;padding:8px 14px;border-radius:10px;cursor:pointer}
  .fbody{padding:6px 20px 22px;overflow:auto}
  aside h3{font-size:14px;color:var(--text);margin:18px 0 9px;font-weight:700}
  .grp{font-size:12px;color:var(--muted);font-weight:600;margin:20px 0 -4px}
  .divider{height:1px;background:var(--line);margin:20px 0 4px}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chips button, label.chk{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:#fff;color:#344054;border-radius:var(--r-sm);padding:8px 13px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
  .chips button:hover, label.chk:hover{border-color:#c4cad4}
  .chips button.on, label.chk:has(input:checked){background:var(--ink);border-color:var(--ink);color:#fff}
  label.chk input{display:none}
  .row2{display:flex;gap:8px;align-items:center;margin-top:8px}
  .row2 span{color:var(--sub);font-size:13px;white-space:nowrap}
  input[type=number],input[type=text],select{width:100%;padding:10px 12px;border:1px solid var(--line2);border-radius:12px;font:inherit;font-size:13px;color:var(--text);background:#fff;outline:none;transition:.15s}
  input:focus,select:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(31,94,255,.12)}
  .hint{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.55}
  .hint b{color:var(--sub)}
  .profile{background:#f8f9fb;border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;font-size:13px;line-height:1.8;margin-top:14px}
  .profile b{color:var(--brand)}

  main{display:flex;flex-direction:column;gap:18px;min-width:0}

  /* KPI */
  .kpis{display:grid;grid-template-columns:1.25fr 1fr 1fr 1fr;gap:12px}
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:16px 18px}
  .card .lb{font-size:12.5px;color:var(--sub);font-weight:600}
  .card .v{font-size:28px;font-weight:800;margin-top:6px;letter-spacing:-.8px}
  .card .v small{font-size:14px;color:var(--sub);font-weight:600;margin-left:3px}
  .card.hero{background:linear-gradient(135deg,#3b7bff 0%,#1f5eff 55%,#1748d6 100%);border:0;color:#fff;box-shadow:0 8px 24px rgba(31,94,255,.28)}
  .card.hero .lb{color:rgba(255,255,255,.8)} .card.hero .v small{color:rgba(255,255,255,.8)}

  .content{display:grid;grid-template-columns:1fr 400px;gap:18px;align-items:start}

  /* 목록 */
  .list{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
  .toolbar{display:flex;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line);align-items:center;flex-wrap:wrap}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tabs button{border:1px solid var(--line2);background:#fff;padding:7px 11px;border-radius:var(--r-sm);cursor:pointer;font:inherit;font-size:13px;font-weight:600;color:#344054}
  .tabs button.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .toolbar .search{margin-left:auto;width:150px}
  .list th:first-child,.list td:first-child{padding-left:14px;padding-right:2px}
  table.rt{width:100%} table.rt td{white-space:nowrap}
  table{width:100%;border-collapse:collapse}
  th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:10px 12px;background:#fbfaf8;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:13px 10px;border-bottom:1px solid #f0eee9;vertical-align:top}
  tr.item{cursor:pointer;transition:background .12s}
  tr.item:hover{background:#fafaf8}
  tr.item.sel{background:var(--brand-soft);box-shadow:inset 3px 0 0 var(--brand)}
  .title{font-weight:700;line-height:1.45;letter-spacing:-.3px}
  .org{font-size:12px;color:var(--sub);margin-top:3px}
  .num{text-align:right;white-space:nowrap}
  td.num{font-weight:700}
  .badge{display:inline-block;font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:8px;white-space:nowrap}
  .b-ok{background:var(--ok-bg);color:var(--ok)} .b-warn{background:var(--warn-bg);color:var(--warn)} .b-no{background:var(--no-bg);color:var(--no)}
  .chip{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:7px;background:#fff;border:1px solid var(--line2);color:#475467;margin:4px 4px 0 0;white-space:nowrap}
  .chip.red{background:var(--no-bg);border-color:transparent;color:var(--no)}
  .chip.blue{background:var(--brand-soft);border-color:transparent;color:var(--brand)}
  .dday{font-weight:800;font-size:12.5px} .dday.hot{color:var(--no)}
  .star{cursor:pointer;color:#d5d9e0;font-size:16px} .star.on{color:#ffb020}

  /* 상세 */
  .detail{position:sticky;top:76px;padding:22px;max-height:calc(100vh - 92px);overflow:auto}
  .detail h2{font-size:19px;margin:12px 0 4px;line-height:1.4;font-weight:800;letter-spacing:-.6px}
  .detail .sec{margin-top:20px}
  .detail .sec h4{font-size:14px;color:var(--text);margin:0 0 10px;font-weight:800}
  .kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .kv .box{border:1px solid var(--line);border-radius:var(--r-md);padding:10px 12px}
  .kv .box .k{font-size:11.5px;color:var(--sub)}
  .kv .box .val{font-size:14px;font-weight:700;margin-top:3px}
  .check{display:flex;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:var(--r-md);margin-bottom:7px;align-items:flex-start;background:#fff}
  .check .ic{width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex:0 0 22px}
  .ic.ok{background:var(--ok-bg);color:var(--ok)} .ic.warn{background:var(--warn-bg);color:var(--warn)} .ic.no{background:var(--no-bg);color:var(--no)}
  .check .t{font-weight:700;font-size:13px} .check .d{font-size:12px;color:var(--sub);margin-top:2px;line-height:1.55}
  blockquote{margin:0;padding:12px 14px;background:#f8f9fb;border:1px solid var(--line);border-radius:var(--r-md);font-size:12.5px;line-height:1.65;color:#344054}
  .btns{display:flex;gap:8px;margin-top:20px}
  .btn{flex:1;padding:11px;border-radius:12px;border:1px solid var(--line2);background:#fff;cursor:pointer;font:inherit;font-weight:700;font-size:13px}
  .btn.pri{background:var(--brand);color:#fff;border-color:var(--brand)}
  .empty{padding:48px;text-align:center;color:var(--muted)}
  a.file{display:block;padding:9px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:6px;color:var(--text);text-decoration:none;font-size:13px;word-break:break-all}
  a.file:hover{border-color:var(--brand);color:var(--brand)}
  .calc{background:#f8f9fb;border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.6}
  .diag{margin:14px auto 0;max-width:560px;text-align:left;background:#f8f9fb;border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:12.5px;line-height:1.8;color:#344054}
  .diag .err{color:var(--no);word-break:break-all;margin-top:4px}
  .tablewrap::-webkit-scrollbar{height:10px} .tablewrap::-webkit-scrollbar-thumb{background:#d5d9e0;border-radius:10px}
  .dtop{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .bigbtn{border:1px solid var(--line2);background:#fff;border-radius:10px;padding:6px 11px;font:inherit;font-size:12.5px;font-weight:700;color:#344054;cursor:pointer;white-space:nowrap}
  .bigbtn:hover{border-color:var(--brand);color:var(--brand)}
  #backdrop{display:none;position:fixed;inset:0;background:rgba(13,17,26,.45);z-index:40}
  #backdrop.on{display:block}
  .detail.big{position:fixed;top:4vh;left:50%;transform:translateX(-50%);width:min(1180px,94vw);max-height:92vh;z-index:50;padding:28px 32px;box-shadow:0 24px 60px rgba(0,0,0,.25)}
  .detail.big h2{font-size:23px}
  .detail.big .dgrid{display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-items:start}
  .detail.big .check .d,.detail.big blockquote{font-size:13.5px}
  .detail.big .kv{grid-template-columns:repeat(3,1fr)}
  .pager{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
  .pager:empty{display:none}
  .pinfo{font-size:12.5px;color:var(--sub)} .pinfo b{color:var(--text)}
  .pbtns{display:flex;gap:4px;align-items:center}
  .pbtns button{min-width:34px;height:34px;padding:0 8px;border:1px solid var(--line2);background:#fff;border-radius:10px;font:inherit;font-size:13px;font-weight:600;color:#344054;cursor:pointer}
  .pbtns button:hover:not(:disabled){border-color:#c4cad4}
  .pbtns button.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .pbtns button:disabled{opacity:.35;cursor:default}
  .pbtns .dots{color:var(--muted);padding:0 2px}
  table.main{table-layout:fixed;width:100%}
  table.main td,table.main th{overflow:hidden}
  table.main th:first-child,table.main td:first-child{padding-left:12px;padding-right:0}
  table.main td{padding:12px 8px}
  table.main .tcell .title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  table.main .ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  table.main .tcell>div:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  table.main td:nth-child(4),table.main td:nth-child(6),table.main td:nth-child(7){white-space:nowrap}
  table.main td.num{font-size:13.5px}
  .tabs button.t-ok{color:var(--ok);border-color:#bfe6da;background:var(--ok-bg)}
  .tabs button.t-ok.on{background:var(--ok);border-color:var(--ok);color:#fff}
  .kpi{cursor:pointer;transition:transform .12s,box-shadow .12s,border-color .12s}
  .kpi:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(16,24,40,.08)}
  .kpi.act{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}
  .kpi.hero.act{box-shadow:0 0 0 3px #fff inset,0 8px 24px rgba(31,94,255,.35)}
  .note{font-size:11.5px;color:var(--muted);text-align:center;padding:4px 0 24px}

  /* 투찰 계산 */
  .rec{background:linear-gradient(135deg,#3b7bff 0%,#1f5eff 55%,#1748d6 100%);border-radius:18px;padding:16px 18px;color:#fff;box-shadow:0 8px 24px rgba(31,94,255,.28)}
  .rec .lb{font-size:12.5px;color:rgba(255,255,255,.85);display:flex;justify-content:space-between;align-items:center;font-weight:600}
  .rec .lb .chip{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.3);margin:0}
  .rec .recv{font-size:28px;font-weight:800;margin:6px 0 4px;letter-spacing:-.8px}
  .rec .hint{color:rgba(255,255,255,.78);margin:0}
  .rec .hint b{color:#fff}
  .rec .modes{display:flex;gap:6px;margin-top:12px}
  .rec .modes button{flex:1;border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;font:inherit;font-weight:700;font-size:12.5px;padding:7px 0;border-radius:10px;cursor:pointer}
  .rec .modes button.on{background:#fff;color:var(--brand);border-color:#fff}
  .ctrl{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px;margin:12px 0}
  .ctrl label{font-size:11.5px;color:var(--sub);font-weight:600;display:flex;flex-direction:column;gap:4px}
  .dist{border:1px solid var(--line);border-radius:var(--r-md);padding:10px 12px;margin-bottom:10px}
  .dist .lb{font-size:12px;color:var(--sub);margin-bottom:8px;font-weight:600}
  .bars{display:flex;align-items:flex-end;gap:4px;height:52px}
  .bar{flex:1;background:#dbe5ff;border-radius:5px 5px 2px 2px;min-height:3px}
  .bar.on{background:var(--brand)}
  .axis{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-top:4px}
  table.rt{font-size:12.5px;border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;border-collapse:separate;border-spacing:0;margin-bottom:8px}
  table.rt th{background:#fbfaf8}
  table.rt th,table.rt td{padding:7px 10px;border-bottom:1px solid #f0eee9}
  table.rt tr:last-child td{border-bottom:0}
  table.rt tr.cen td{background:#fafaf8}
  table.rt tr.hit td{background:var(--brand-soft);color:var(--brand);font-weight:800}
</style>
</head>
<body>
<header>
  <h1>입찰<em>레이더</em></h1><span class="tag">나라장터 실데이터</span>
  <div class="right"><span class="pill"><span class="dot" id="dot"></span>마지막 수집 <b id="lastAt">-</b></span><button class="reset" id="refreshBtn">↻ 지금 수집</button></div>
</header>

<div class="wrap">
  <!-- 필터 사이드바 -->
  <aside>
    <div class="fhead"><div><h2>검색필터 전체</h2><div class="cnt" id="fcnt">적용 필터 0개</div></div><button class="reset" id="resetBtn">초기화</button></div>
    <div class="fbody">
    <div class="profile" id="profileBox"></div>

    <div class="grp">내 회사</div>
    <h3>본점 소재지</h3>
    <div class="chips" id="baseSeg">
      <button data-v="인천" class="on">인천</button><button data-v="서울">서울</button><button data-v="경기">경기</button>
    </div>
    <div class="hint">법인등기·사업자등록상 <b>본점</b> 기준, 공고일 전일로 판정</div>

    <h3>보유 실적</h3>
    <div class="chips"><label class="chk"><input type="checkbox" id="hasSchool" checked>학교 실내건축 실적</label></div>
    <div class="row2"><input type="number" id="schoolAmt" value="1" step="0.1" min="0"><span>억원 이상</span></div>

    <div class="divider"></div>
    <div class="grp">공고 조건</div>
    <h3>공사 현장 지역</h3>
    <div class="chips">
      <label class="chk"><input type="checkbox" class="rgn" value="인천" checked>인천</label>
      <label class="chk"><input type="checkbox" class="rgn" value="서울" checked>서울</label>
      <label class="chk"><input type="checkbox" class="rgn" value="경기" checked>경기</label>
    </div>

    <h3>낙찰방법</h3>
    <div class="chips"><label class="chk"><input type="checkbox" id="onlyQual" checked>적격심사만</label></div>

    <h3>추정가격</h3>
    <div class="row2" style="margin-top:0"><input type="number" id="pMin" value="0.5" step="0.5"><span>~</span><input type="number" id="pMax" value="5" step="0.5"><span>억</span></div>

    <h3>발주처</h3>
    <div class="chips"><label class="chk"><input type="checkbox" id="onlySchool">교육청·학교만</label></div>

    <h3>현장설명회</h3>
    <div class="chips"><label class="chk"><input type="checkbox" id="hideMissed" checked>지난 필참 설명회 숨김</label></div>
    </div>
  </aside>

  <main>
    <div class="kpis">
      <div class="card hero kpi" data-t="ok" title="참여 가능 공고만 보기"><div class="lb">✅ 참여 가능</div><div class="v" id="kOk">0<small>건</small></div></div>
      <div class="card kpi act" data-t="all" title="전체 공고 보기"><div class="lb">필터 통과 / 수집 (7일)</div><div class="v" id="kAll">0<small>건</small></div></div>
      <div class="card kpi" data-t="warn" title="확인 필요 공고만 보기"><div class="lb">⚠️ 확인 필요</div><div class="v" id="kWarn" style="color:var(--warn)">0<small>건</small></div></div>
      <div class="card kpi" data-t="soon" title="3일 내 마감 공고만 보기"><div class="lb">⏰ 3일 내 마감</div><div class="v" id="kSoon" style="color:var(--no)">0<small>건</small></div></div>
    </div>

    <div class="content">
      <div class="list">
        <div class="toolbar">
          <div class="tabs" id="tabs">
            <button data-t="all" class="on">전체</button>
            <button data-t="ok" class="t-ok">✓ 참여 가능</button>
            <button data-t="warn">확인 필요</button>
            <button data-t="no">불가</button>
            <button data-t="star">★ 관심</button>
            <button data-t="soon" id="soonTab" style="display:none">⏰ 3일 내 마감</button>
          </div>
          <input type="text" class="search" id="q" placeholder="공고명·기관 검색">
          <select id="perPage" style="width:96px" title="한 화면에 보여줄 공고 수"><option value="10" selected>10개씩</option><option value="20">20개씩</option><option value="50">50개씩</option><option value="100">100개씩</option></select>
          <select id="sort" style="width:118px">
            <option value="dl">마감 임박순</option>
            <option value="price">금액 큰 순</option>
            <option value="new">최신 공고순</option>
          </select>
        </div>
        <div class="tablewrap"><table class="main">
          <colgroup><col style="width:34px"><col style="width:72px"><col><col style="width:74px"><col style="width:78px"><col style="width:66px"><col style="width:62px"></colgroup>
          <thead><tr><th></th><th>판정</th><th>공고명 / 수요기관</th><th>참가지역</th><th class="num">추정가격</th><th>현장설명</th><th>마감</th></tr></thead>
          <tbody id="tbody"></tbody>
        </table></div>
        <div id="pager" class="pager"></div>
        <div id="empty" class="empty" style="display:none"></div>
      </div>

      <div class="card detail" id="detail"></div>
      <div id="backdrop" onclick="toggleBig(false)"></div>
    </div>
    <div class="note" id="note">※ 1차 판정: 참가가능지역·면허·낙찰방법 기준. 실적·현장설명회는 공고문 원문 확인 필요</div>
  </main>
</div>

<script>
let TODAY = new Date();
// 가상 샘플 데이터
let DATA = [];  // /api/bids 에서 불러옴
let META = {};
function localStorageGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function localStorageSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
async function load(refresh){
  const btn=$('#refreshBtn'); btn.disabled=true; btn.textContent=refresh?'수집 중…':'불러오는 중…';
  try{
    const r=await fetch(refresh?'/api/refresh':'/api/bids',{method:refresh?'POST':'GET'});
    const j=await r.json();
    if(j.error && j.error.includes('NO_ENV')){
      const key=prompt('인증키 파일(.env)을 찾지 못했습니다.\n공공데이터포털 마이페이지의 「일반 인증키」를 붙여넣어 주세요.\n(한 번 입력하면 자동 저장됩니다)');
      if(key){
        const region=prompt('본점 소재지 (인천 / 서울 / 경기)','인천')||'인천';
        const r2=await fetch('/api/setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key,region})});
        const j2=await r2.json(); if(j2.error) alert('수집 오류: '+j2.error); Object.assign(j,j2,{error:j2.error});
      }
    } else if(j.error){alert('수집 오류: '+j.error);}
    DATA=j.items||[]; TODAY=new Date(); META=j;
    $('#lastAt').textContent=j.collected_at||'-';
    if(!DATA.find(x=>x.id===S.sel)) S.sel=DATA[0]?.id||null;
    render();
  }catch(e){console.error(e);alert('불러오기 실패: '+e.message+'\n(app.py가 실행 중인지 확인하세요)');}
  btn.disabled=false; btn.textContent='↻ 지금 수집';
}

const S = {base:'인천',tab:'all',sel:null,stars:new Set(JSON.parse(localStorageGet('stars')||'[]'))};
const $ = s=>document.querySelector(s), $$ = s=>[...document.querySelectorAll(s)];
const d = s=>new Date(s.replace(' ','T'));
const won = v=>v==null?'-':(v>=1? v.toFixed(2).replace(/\.?0+$/,'')+'억': Math.round(v*10000).toLocaleString()+'만')+'원';
function dday(s){if(!s)return '-';const n=Math.ceil((d(s)-TODAY)/86400000);return n<0?'마감':n===0?'D-day':'D-'+n}

function judge(x){
  const c=[]; // 체크리스트
  const rOk = x.allow.includes('전국')||x.allow.includes(S.base);
  c.push({k:rOk?'ok':'no',t:'참가 가능 지역',d:rOk?`참가가능지역 [${x.allow.join(', ')}] — ${S.base} 업체 참여 가능`:`참가가능지역 [${x.allow.join(', ')}] — 본점 ${S.base}는 참여 불가`});
  if(x.licOk===true) c.push({k:'ok',t:'면허 (업종)',d:`면허제한 [${x.lic}] — 실내건축공사업 일치`});
  else if(x.licOk===false) c.push({k:'no',t:'면허 (업종)',d:`면허제한 [${x.lic}] — 실내건축공사업으로 참여 불가`});
  else if(x.licOk===null) c.push({k:'warn',soft:true,t:'면허 (업종)',d:'면허제한 정보 없음 — 공고문에서 업종 확인 필요'});
  if(x.joint){const jOk = x.joint.rgn===S.base; c.push({k:jOk?'ok':'warn',t:'공동도급 의무지역',d:jOk?`${x.joint.rgn} 업체 ${x.joint.ratio}% 이상 — 본인이 지역업체로 참여 가능`:`${x.joint.rgn} 지역업체와 ${x.joint.ratio}% 이상 공동도급 필요 — 파트너 섭외`});}
  const has=$('#hasSchool').checked, amt=+$('#schoolAmt').value||0;
  if(x.perf&&x.perf.type==='pending') c.push({k:'warn',soft:true,t:'실적 제한',d:'공고문 자동 분석 전 — 공고문 원문에서 확인하세요'});
  else if(!x.perf) c.push({k:'ok',t:'실적 제한',d:'실적 제한 없음'});
  else if(x.perf.type==='unknown') c.push({k:'warn',t:'실적 제한',d:'자동 판정 실패 — 공고문 원문 확인 필요'});
  else {const ok=has&&amt>=x.perf.amt; c.push({k:ok?'ok':'no',t:'실적 제한',d:`요구: ${x.perf.type} ${x.perf.amt}억 이상 / 보유: ${has?amt+'억':'없음'}`});}
  if(x.brief==='pending') c.push({k:'warn',soft:true,t:'현장설명회',d:'공고문 자동 분석 전 — 원문 확인 필요'});
  else if(!x.brief) c.push({k:'ok',t:'현장설명회',d:'없음'});
  else {const past=d(x.brief.date)<TODAY;
    if(x.brief.must&&past) c.push({k:'no',t:'현장설명회 (필참)',d:`${x.brief.date} — 이미 지남, 참여 불가`});
    else c.push({k:x.brief.must?'warn':'ok',t:`현장설명회 (${x.brief.must?'필참':'선택'})`,d:`${x.brief.date} · ${x.brief.place}${x.brief.must?' — 일정 확보 필요':''}`});}
  const mOk = /적격/.test(x.method||''); if(!x.method) c.push({k:'warn',soft:true,t:'낙찰방법',d:'정보 없음 — 공고문 확인'}); else c.push({k:mOk?'ok':'warn',t:'낙찰방법',d:mOk?`${x.method}${x.rate?' · 낙찰하한율 '+x.rate.toFixed(3)+'%':''}`:(x.method||'정보 없음')});
  const st = c.some(i=>i.k==='no')?'no':c.some(i=>i.k==='warn' && !i.soft && !i.t.startsWith('현장설명회'))?'warn':'ok';
  return {st,c};
}

function filtered(){
  const rg=$$('.rgn:checked').map(e=>e.value), q=$('#q').value.trim();
  const pMin=+$('#pMin').value, pMax=+$('#pMax').value;
  return DATA.map(x=>({...x,j:judge(x)})).filter(x=>{
    if(x.site && !rg.includes(x.site)) return false;
    if($('#onlyQual').checked && x.method && !/적격/.test(x.method)) return false;  // 낙찰방법 정보가 없으면 숨기지 않음
    if(x.price!=null && (x.price<pMin||x.price>pMax)) return false;
    if($('#onlySchool').checked && !/교육|학교|초|중|고|유치원/.test(x.org)) return false;
    if($('#hideMissed').checked && x.brief && x.brief.must && d(x.brief.date)<TODAY) return false;
    if(x.close && d(x.close)<TODAY) return false;
    if(q && !(x.name+x.org).includes(q)) return false;
    return true;
  });
}

function render(){
  countFilters();
  $('#profileBox').innerHTML=`본점: <b>${S.base}</b><br>면허: 실내건축공사업<br>실적: ${$('#hasSchool').checked?'학교 '+$('#schoolAmt').value+'억':'학교 실적 없음'}`;
  let rows=filtered();
  $('#kAll').innerHTML=rows.length+'<small>/ '+DATA.length+'건</small>';
  $('#kOk').innerHTML=rows.filter(r=>r.j.st==='ok').length+'<small>건</small>';
  $('#kWarn').innerHTML=rows.filter(r=>r.j.st==='warn').length+'<small>건</small>';
  $('#kSoon').innerHTML=rows.filter(r=>r.j.st!=='no'&&(d(r.close)-TODAY)/86400000<=3).length+'<small>건</small>';
  if(S.tab==='star') rows=rows.filter(r=>S.stars.has(r.id)); else if(S.tab==='soon') rows=rows.filter(r=>r.j.st!=='no'&&(d(r.close)-TODAY)/86400000<=3); else if(S.tab!=='all') rows=rows.filter(r=>r.j.st===S.tab);
  const so=$('#sort').value;
  rows.sort((a,b)=>so==='price'?(b.price||0)-(a.price||0):so==='new'?d(b.posted)-d(a.posted):d(a.close)-d(b.close));
  const B={ok:['b-ok','참여 가능'],warn:['b-warn','확인 필요'],no:['b-no','불가']};
  // ---- 페이지 나누기 ----
  const fkey=JSON.stringify([S.base,S.tab,so,$('#q').value,$$('aside input').map(i=>i.type==='checkbox'?i.checked:i.value)]);
  if(fkey!==S.fkey){S.fkey=fkey;S.page=1;}
  const per=+$('#perPage').value, pages=Math.max(1,Math.ceil(rows.length/per));
  S.page=Math.min(Math.max(1,S.page||1),pages);
  const from=(S.page-1)*per, pageRows=rows.slice(from,from+per);
  renderPager(rows.length,per,pages,from,pageRows.length);
  $('#tbody').innerHTML=pageRows.map(r=>{
    const dd=dday(r.close), hot=(d(r.close)-TODAY)/86400000<=3;
    const br=r.brief==='pending'?'<span class="org">원문확인</span>':r.brief?`<span class="chip ${r.brief.must?'red':''}">${r.brief.must?'필참':'선택'}</span><div class="org">${r.brief.date.slice(5)}</div>`:'<span class="org">없음</span>';
    return `<tr class="item ${r.id===S.sel?'sel':''}" data-id="${r.id}">
      <td><span class="star ${S.stars.has(r.id)?'on':''}" data-star="${r.id}">★</span></td>
      <td><span class="badge ${B[r.j.st][0]}">${B[r.j.st][1]}</span></td>
      <td class="tcell"><div class="title" title="${r.name}">${r.name}</div><div class="org ell" title="${r.org}">${r.org}</div>
        <div>${r.match?`<span class="chip ${r.match==='면허'?'blue':''}">${r.match==='면허'?'면허 일치':'🔎 '+r.match.replace('키워드:','')}</span>`:''}${r.perf&&r.perf.type!=='pending'?`<span class="chip">실적 ${r.perf.type==='unknown'?'확인':r.perf.type+' '+r.perf.amt+'억'}</span>`:''}${r.joint?`<span class="chip blue">공동도급</span>`:''}${r.method?`<span class="chip" title="${r.method}">${shortMethod(r.method)}</span>`:''}</div></td>
      <td>${r.allow.map(a=>`<span class="chip ${a===S.base||a==='전국'?'blue':''}">${a}</span>`).join('')}<div class="org">현장 ${r.site}</div></td>
      <td class="num">${won(r.price)}</td>
      <td>${br}</td>
      <td><span class="dday ${hot?'hot':''}">${dd}</span><div class="org">${r.close.slice(5,10)}</div></td></tr>`;
  }).join('');
  $('#empty').style.display=rows.length?'none':'block';
  $('#empty').innerHTML = DATA.length? `수집된 ${DATA.length}건이 모두 필터에 걸렸습니다.<br><small>왼쪽 [초기화]를 누르거나 추정가격 범위·적격심사만 조건을 풀어보세요</small>` : `<b>표시할 공고가 0건입니다</b><div class="diag">
      <div>조회기간: ${META.period||'-'}</div>
      <div>나라장터 공사공고 전체: <b>${META.total_notices??'-'}건</b> → 면허·키워드 통과: <b>${META.raw_count??0}건</b></div>
      ${(META.errors||[]).length?`<div class="err">API 오류<br>${META.errors.map(e=>e.replace(/</g,'&lt;')).join('<br>')}</div>`:'<div>API 오류 없음</div>'}
      <div class="hint">이 박스를 캡처해서 보내주세요</div></div>`;
  if(!rows.find(r=>r.id===S.sel) && rows[0]) S.sel=rows[0].id;
  renderDetail(rows.find(r=>r.id===S.sel));
}

function toggleBig(force){
  S.big = force===undefined ? !S.big : force;
  $('#detail').classList.toggle('big',S.big);
  $('#backdrop').classList.toggle('on',S.big);
  document.body.style.overflow = S.big?'hidden':'';
  const b=$('#bigBtn'); if(b) b.textContent = S.big?'✕ 닫기':'⤢ 크게보기';
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.big)toggleBig(false);});

function renderPager(total,per,pages,from,n){
  const p=S.page, el=$('#pager');
  if(!total){el.innerHTML='';return;}
  const win=[]; const lo=Math.max(1,p-2), hi=Math.min(pages,lo+4);
  for(let i=Math.max(1,hi-4);i<=hi;i++) win.push(i);
  const btn=(label,to,cls='',dis=false)=>`<button class="${cls}" data-page="${to}" ${dis?'disabled':''}>${label}</button>`;
  el.innerHTML=`<div class="pinfo">${total}건 중 <b>${from+1}–${from+n}</b></div>
    <div class="pbtns">${btn('«',1,'',p===1)}${btn('‹',p-1,'',p===1)}
    ${win[0]>1?'<span class="dots">…</span>':''}${win.map(i=>btn(i,i,i===p?'on':'')).join('')}${win[win.length-1]<pages?'<span class="dots">…</span>':''}
    ${btn('›',p+1,'',p===pages)}${btn('»',pages,'',p===pages)}</div>`;
}

function shortMethod(m){return String(m).split(/[-(]/)[0].trim()||m}

function renderDetail(x){
  const el=$('#detail');
  if(!x){el.innerHTML='<div class="empty">공고를 선택하세요</div>';return;}
  const B={ok:['b-ok','참여 가능'],warn:['b-warn','확인 필요'],no:['b-no','불가']}[x.j.st];
  const lower = x.rate? x.base*x.rate/100 : null;
  el.innerHTML=`
    <div class="dtop"><div><span class="badge ${B[0]}">${B[1]}</span> <span class="chip">${x.id}</span></div>
      <button class="bigbtn" id="bigBtn">${S.big?'✕ 닫기':'⤢ 크게보기'}</button></div>
    <h2>${x.name}</h2><div class="org">${x.org}</div>
    <div class="dgrid"><div class="dcol">
    <div class="sec"><h4>자격 체크리스트</h4>
      ${x.j.c.map(i=>`<div class="check"><div class="ic ${i.k}">${i.k==='ok'?'✓':i.k==='warn'?'!':'✕'}</div><div><div class="t">${i.t}</div><div class="d">${i.d}</div></div></div>`).join('')}
    </div>
    ${x.perf&&x.perf.type!=='pending'?`<div class="sec"><h4>공고문 실적 조건 원문 (자동 추출)</h4><blockquote>${x.perf.text}</blockquote></div>`:''}
    <div class="sec"><h4>공고 정보</h4><div class="kv">
      ${[['추정가격',won(x.price)],['기초금액',won(x.base)],['낙찰방법',(x.method?shortMethod(x.method):'-')+(x.rate?' · '+x.rate.toFixed(3)+'%':'')],['업종',x.lic],['공사 현장',x.site],['공고일',x.posted]].map(([k,v])=>`<div class="box"><div class="k">${k}</div><div class="val">${v}</div></div>`).join('')}
      <div class="box" style="grid-column:1/-1"><div class="k">입찰 마감</div><div class="val">${x.close} <span class="dday ${(d(x.close)-TODAY)/86400000<=3?'hot':''}">${dday(x.close)}</span></div></div>
    </div></div>

    ${(x.files||[]).length?`<div class="sec"><h4>첨부파일</h4>${x.files.map(f=>`<a class="file" href="${f.url}" target="_blank" rel="noopener">📄 ${f.name||'첨부파일'}</a>`).join('')}</div>`:''}
    <div class="btns"><button class="btn pri" onclick="${x.url?`window.open('${x.url}','_blank')`:'alert(\'공고 링크 정보가 없습니다\')'}">나라장터에서 공고 보기 ↗</button></div>
    </div><div class="dcol">
    ${x.rate?`<div class="sec" id="bidSec"></div>`:''}
    </div></div>`;
  if(x.rate){ if(S.calcFor!==x.id){S.calcFor=x.id;S.calc={rate:x.rate,range:2,step:0.25,mode:'mid'};} renderBid(x); }
}

// ---------- 투찰금액 계산 ----------
// 샘플: 발주처 최근 유사공고 낙찰 사정률(예정가격/기초금액, %) — 실제는 낙찰정보 API에서 수집
function history(x){
  let s=[...x.id].reduce((a,c)=>a+c.charCodeAt(0),0), out=[];
  for(let i=0;i<20;i++){ s=(s*9301+49297)%233280; const r=s/233280; out.push(+(99.0+r*1.6+(i%3-1)*0.15).toFixed(3)); }
  return out.sort((a,b)=>a-b);
}
const q = (arr,p)=>{const i=(arr.length-1)*p, lo=Math.floor(i), hi=Math.ceil(i); return arr[lo]+(arr[hi]-arr[lo])*(i-lo);};
const ceilWon = v=>Math.ceil(v);
const fmt = v=>Math.round(v).toLocaleString()+'원';

function renderBid(x){
  const C=S.calc;
  if(!x.base){ $('#bidSec').innerHTML=`<h4>💰 투찰금액 계산</h4><div class="calc">기초금액이 아직 공개되지 않았습니다. 기초금액 발표 후 다시 수집하면 계산됩니다.<div class="hint">하한율 ${C.rate.toFixed(3)}% · 추정가격 ${won(x.price)}</div></div>`; return; }
  const baseWon=x.base*1e8, h=(x.hist&&x.hist.length)?[...x.hist].sort((a,b)=>a-b):[100];
  const strat={safe:{p:0.25,lb:'안정형 (하위 25%)'},mid:{p:0.5,lb:'중간형 (중앙값)'},aggr:{p:0.75,lb:'공격형 (상위 25%)'}};
  const hasHist=h.length>1; const recS = hasHist? +q(h,strat[C.mode].p).toFixed(3) : 100;  // 추천 사정률
  const recBid = ceilWon(baseWon*recS/100*C.rate/100);         // 추천 투찰금액
  const minBid = ceilWon(baseWon*C.rate/100);                  // 사정률 100% 기준 하한
  // 사정률 표
  const rows=[]; for(let s=100-C.range; s<=100+C.range+1e-9; s+=C.step){ rows.push(+s.toFixed(3)); }
  const near = rows.reduce((a,b)=>Math.abs(b-recS)<Math.abs(a-recS)?b:a, rows[0]);
  // 분포 막대
  const bins={}; h.forEach(v=>{const b=(Math.floor(v*4)/4).toFixed(2); bins[b]=(bins[b]||0)+1;});
  const bk=Object.keys(bins).sort((a,b)=>a-b), mx=Math.max(...Object.values(bins));
  $('#bidSec').innerHTML=`
    <h4>💰 투찰금액 계산 · 추천</h4>
    <div class="rec">
      <div class="lb">${hasHist?'추천 투찰금액':'사정률 100% 기준 투찰금액'} <span class="chip blue">${hasHist?strat[C.mode].lb:'낙찰통계 연동 전'}</span></div>
      <div class="recv">${fmt(recBid)}</div>
      <div class="hint" style="margin:0">= 기초금액 ${fmt(baseWon)} × 사정률 <b>${recS.toFixed(3)}%</b> × 하한율 <b>${C.rate.toFixed(3)}%</b> (원 단위 올림)</div>
      <div class="modes" id="modeSeg" style="${hasHist?'':'display:none'}">
        ${Object.entries(strat).map(([k,v])=>`<button data-m="${k}" class="${C.mode===k?'on':''}">${v.lb.split(' ')[0]}</button>`).join('')}
      </div>
    </div>
    <div class="ctrl">
      <label>낙찰하한율(%)<input type="number" id="cRate" value="${C.rate.toFixed(3)}" step="0.001"></label>
      <label>사정률 범위<select id="cRange">${[1,2,3].map(v=>`<option value="${v}" ${C.range==v?'selected':''}>±${v}%</option>`).join('')}</select></label>
      <label>간격<select id="cStep">${[0.1,0.25,0.5].map(v=>`<option value="${v}" ${C.step==v?'selected':''}>${v}%</option>`).join('')}</select></label>
    </div>
    <div class="dist" style="${hasHist?'':'display:none'}">
      <div class="lb">발주처 최근 낙찰 사정률 분포 (샘플 ${h.length}건)</div>
      <div class="bars">${bk.map(b=>`<div class="bar ${+b<=recS&&recS<+b+0.25?'on':''}" style="height:${bins[b]/mx*100}%" title="${b}% : ${bins[b]}건"></div>`).join('')}</div>
      <div class="axis"><span>${bk[0]}%</span><span>${bk[bk.length-1]}%</span></div>
    </div>
    <table class="rt">
      <thead><tr><th>사정률</th><th class="num">예정가격</th><th class="num">투찰금액</th></tr></thead>
      <tbody>${rows.map(s=>{const pre=baseWon*s/100, bid=ceilWon(pre*C.rate/100);
        return `<tr class="${s===near?'hit':''} ${s===100?'cen':''}"><td>${s.toFixed(3)}%${s===near?' ⭐':''}</td><td class="num">${fmt(pre)}</td><td class="num"><b>${fmt(bid)}</b></td></tr>`}).join('')}</tbody>
    </table>
    <div class="hint">· 사정률 = 예정가격 ÷ 기초금액. 예정가격은 복수예비가격 15개 중 추첨된 4개 평균이라 개찰 전에는 알 수 없음<br>
    · 투찰금액이 <b>예정가격 × 하한율</b>보다 낮으면 탈락 → 실제 사정률이 추천값보다 높게 나오면 무효 위험<br>
    · 사정률 100% 기준 하한금액: ${fmt(minBid)}<br>
    · ${hasHist?'추천은 발주처 과거 낙찰 사정률 기준 참고값':'추천 사정률은 낙찰정보서비스 API 연동 후 표시됩니다'}</div>`;
}

$('#detail').addEventListener('change',e=>{
  if(!S.calc) return; const x=DATA.find(d=>d.id===S.calcFor);
  if(e.target.id==='cRate') S.calc.rate=+e.target.value||0;
  if(e.target.id==='cRange') S.calc.range=+e.target.value;
  if(e.target.id==='cStep') S.calc.step=+e.target.value;
  renderBid(x);
});
$('#detail').addEventListener('click',e=>{
  if(e.target.id==='bigBtn'){toggleBig();return;}
  const m=e.target.dataset.m; if(!m) return; S.calc.mode=m; renderBid(DATA.find(d=>d.id===S.calcFor));
});

// 이벤트
$('#tbody').addEventListener('click',e=>{
  const st=e.target.dataset.star; if(st){S.stars.has(st)?S.stars.delete(st):S.stars.add(st);localStorageSet('stars',JSON.stringify([...S.stars]));render();return;}
  const tr=e.target.closest('tr.item'); if(tr){S.sel=tr.dataset.id;render();}
});
$$('#baseSeg button').forEach(b=>b.onclick=()=>{$$('#baseSeg button').forEach(x=>x.classList.remove('on'));b.classList.add('on');S.base=b.dataset.v;render();});
function setTab(t){
  S.tab=t;
  $$('#tabs button').forEach(x=>x.classList.toggle('on',x.dataset.t===t));
  $$('.kpi').forEach(x=>x.classList.toggle('act',x.dataset.t===t));
  const sb=$('#soonTab'); sb.style.display=t==='soon'?'':'none';
  render();
}
$$('#tabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.t));
$$('.kpi').forEach(c=>c.onclick=()=>setTab(c.dataset.t));  // 스크롤 이동 없이 목록만 전환
$$('aside input, #q, #sort').forEach(i=>i.addEventListener('input',render));
$('#perPage').addEventListener('change',()=>{S.page=1;localStorageSet('perPage',$('#perPage').value);render();});
$('#pager').addEventListener('click',e=>{const b=e.target.closest('button[data-page]'); if(!b||b.disabled) return; S.page=+b.dataset.page; render(); $('.list').scrollIntoView({behavior:'smooth',block:'start'});});
{const pp=localStorageGet('perPage'); if(pp) $('#perPage').value=pp;}

const DEF={hasSchool:true,schoolAmt:1,onlyQual:true,pMin:0.5,pMax:5,onlySchool:false,hideMissed:true};
function countFilters(){let n=0;if($$('.rgn:checked').length<3)n++;if($('#onlyQual').checked)n++;if(+$('#pMin').value!==0||+$('#pMax').value<99)n++;if($('#onlySchool').checked)n++;if($('#hideMissed').checked)n++;if($('#q').value)n++;$('#fcnt').textContent='적용 필터 '+n+'개';}
$('#refreshBtn').onclick=()=>load(true);
$('#resetBtn').onclick=()=>{$('#hasSchool').checked=DEF.hasSchool;$('#schoolAmt').value=DEF.schoolAmt;$('#onlyQual').checked=DEF.onlyQual;$('#pMin').value=DEF.pMin;$('#pMax').value=DEF.pMax;$('#onlySchool').checked=DEF.onlySchool;$('#hideMissed').checked=DEF.hideMissed;$$('.rgn').forEach(e=>e.checked=true);$('#q').value='';render();};
load(false);
</script>
</body>
</html>
